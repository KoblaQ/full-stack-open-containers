services:
  app:
    image: todo-front-dev
    build:
      context: ./todo-frontend
      dockerfile: dev.Dockerfile
    volumes:
      - ./todo-frontend:/usr/src/app
    ports:
      - 5173:5173
    container_name: todo-front-dev
  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - app
      - server
  server:
    image: todo-backend-dev
    container_name: todo-backend-dev
    ports:
      - 3000:3000
    build:
      context: ./todo-backend # The context will pick this directory as the "build context"
      dockerfile: dev.Dockerfile # This will simply tell which dockerfile to read
    volumes:
      - ./todo-backend:/usr/src/app
    # depends_on:
    #   - redis
    env_file:
      - ./todo-backend/.env
    environment:
      - REDIS_URL=redis://redis:6379 # Needs to be redis and not localhost
      # - MONGO_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_INITDB_DATABASE}?authSource=admin
  mongo:
    image: mongo
    ports:
      - 3456:27017
    # environment:
    # MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
    # MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    # MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - ./todo-backend/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
      # - ./mongo_data:/data/db. # For binding mount
      - mongo_data:/data/db # For named volume
    env_file:
      - ./todo-backend/.env
  redis:
    image: redis
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
volumes:
  mongo_data:
  redis_data:
