services:
  app:
    image: todo-front
    build:
      context: ./todo-frontend
      dockerfile: Dockerfile
    # volumes:
    # - ./todo-frontend:/usr/src/app
    # - ./todo-frontend:/usr/share/nginx/html
    container_name: todo-front
  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./todo-frontend/dist:/usr/share/nginx/html:ro
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - app
      - backend
  backend:
    image: todo-backend
    container_name: todo-backend
    ports:
      - 3000:3000
    build:
      context: ./todo-backend # The context will pick this directory as the "build context"
      dockerfile: Dockerfile # This will simply tell which dockerfile to read
    # volumes:
    #   - ./todo-backend:/usr/src/app
    # depends_on:
    #   - redis
    env_file:
      - ./todo-backend/.env
    environment:
      - REDIS_URL=redis://redis:6379 # Needs to be redis and not localhost
      # - MONGO_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_INITDB_DATABASE}?authSource=admin
  mongo:
    image: mongo
    ports:
      - 3456:27017
    volumes:
      - ./todo-backend/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
      # - ./mongo_data:/data/db. # For binding mount
      - mongo_data:/data/db # For named volume
    env_file:
      - ./todo-backend/.env
  redis:
    image: redis
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
volumes:
  mongo_data:
  redis_data:
